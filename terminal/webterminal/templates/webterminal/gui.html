{% extends base_template %}

{% block title %}Terminal{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-12">
        <div class="card card-default" style="margin-bottom: 0px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <div class="card-body" style="padding: 0px; height: calc(100vh - 160px); min-height: 600px; position: relative; background: #1e1e1e;">
                <iframe src="/3rdparty/webterminal/index.html" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>
    </div>
</div>
{% endblock %}
